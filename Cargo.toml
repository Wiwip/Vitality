[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
bevy_app = { version = "0.20", default-features = false, features = ["std", "bevy_reflect"] }
bevy_platform = { version = "0.20", default-features = false }
bevy_utils = { version = "0.20", default-features = false }
bevy_tasks = { version = "0.20", default-features = false }
bevy_asset = { version = "0.20", default-features = false }
bevy_derive = { version = "0.20" }
bevy_log = { version = "0.20", default-features = false }
bevy_math = { version = "0.20", default-features = false, features = ["std", "bevy_reflect"] }
bevy_scene = { version = "0.20", default-features = false }
bevy_text = { version = "0.20", default-features = false }
bevy_ui = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "bevy_reflect"] }
bevy_time = { version = "0.20", default-features = false, features = ["std", "bevy_reflect"] }
tracing = { version = "0.1", default-features = false }
bevy_reflect = { version = "0.20", default-features = false, features = ["smol_str"] }
express-it = { path = "../express-it" }
hfsm_bevy = { path = "../hfsm-rs/crates/hfsm_bevy" }
ptree = "0.5"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
smol_str = "0.2.2"
vitality_abilities = { path = "crates/vitality_abilities" }
vitality_core = { path = "crates/vitality_core" }
vitality_debug = { path = "crates/vitality_debug" }
vitality_effects = { path = "crates/vitality_effects" }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = true