[package]
name = "vitality_debug"
version = "0.2.0"
edition = "2024"

[dependencies]
ptree = { workspace = true }
vitality_abilities = { workspace = true }
vitality_core = { workspace = true }
vitality_effects = { workspace = true }

bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_log = { workspace = true }
bevy_scene = { workspace = true }
bevy_text = { workspace = true }
bevy_ui = { workspace = true }

[dev-dependencies.bevy]
workspace = true
# the overlay's own tests build a real app and `MinimalPlugins` lives only in the meta-crate
features = ["std", "bevy_log", "bevy_asset", "bevy_scene"]
