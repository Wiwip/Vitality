[package]
name = "vitality_effects"
version = "0.2.0"
edition = "2024"

[dependencies]
express-it = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
smol_str = { workspace = true }
vitality_core = { workspace = true }

bevy_app = { workspace = true }
bevy_derive = { workspace = true }
bevy_reflect = { workspace = true }
bevy_ecs = { workspace = true }
bevy_time = { workspace = true }
bevy_platform = { workspace = true }
bevy_utils = { workspace = true }
bevy_tasks = { workspace = true }
tracing = { workspace = true }

# bevy's own feature: the condition walk's parallel half is compiled only with it, because the task
# hand-off costs more on a one-thread pool than the walk wins
[features]
multi_threaded = ["bevy_ecs/multi_threaded", "bevy_tasks/multi_threaded"]
