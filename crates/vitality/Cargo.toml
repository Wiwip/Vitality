[package]
name = "vitality"
version = "0.2.0"
edition = "2024"

[features]
default = ["debug-overlay"]
debug-overlay = ["dep:vitality_debug"]
multi_threaded = ["bevy/multi_threaded"]
dyn = ["bevy/dynamic_linking"]
# windowed examples; ui pulls default_platform and with it multi_threaded
examples = [
    "debug-overlay",
    "bevy/ui",
    "bevy/default_font",
    "bevy/bevy_ui_debug",
    "bevy/bevy_feathers",
    "bevy/debug",
]

[dependencies]
express-it = { workspace = true }
hfsm_bevy = { workspace = true }
num-traits = { workspace = true }
smol_str = { workspace = true }
vitality_abilities = { workspace = true }
vitality_core = { workspace = true }
vitality_debug = { workspace = true, optional = true }
vitality_effects = { workspace = true }

[dependencies.bevy]
workspace = true
features = ["bevy_log", "bevy_asset", "bevy_scene", "std"]

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }

[dev-dependencies.bevy]
workspace = true
# debug: the bench harness finds Dirty<T> by component name
features = ["bevy_state", "debug"]

[[bench]]
name = "bench_systems"
harness = false

[[example]]
name = "simple"
required-features = ["examples"]

[[example]]
name = "abilities"
required-features = ["examples"]

[[example]]
name = "plan"
required-features = ["examples"]
