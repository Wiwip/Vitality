[package]
name = "vitality"
version = "0.2.0"
edition = "2024"

[features]
default = ["debug-overlay"]
debug-overlay = ["dep:vitality_debug"]

[dependencies]
express-it = { workspace = true }
hfsm_bevy = { workspace = true }
num-traits = { workspace = true }
smol_str = { workspace = true }
vitality_abilities = { workspace = true }
vitality_core = { workspace = true }
vitality_debug = { workspace = true, optional = true }
vitality_effects = { workspace = true }

[dependencies.bevy]
workspace = true
features = ["bevy_log", "bevy_asset", "bevy_scene"]

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }

[dev-dependencies.bevy]
workspace = true
features = [
    "ui",
    "bevy_state",
    "default_font",
    "dynamic_linking",
    "bevy_ui_debug",
    "bevy_feathers",
    "debug",
]

[[bench]]
name = "bench_systems"
harness = false
